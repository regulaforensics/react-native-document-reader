apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.regula.plugin.document.reader'
    }

    compileSdk 36

    defaultConfig {
        minSdkVersion 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }
}

rootProject.allprojects {
    repositories {
        maven { url "https://maven.regulaforensics.com/RegulaDocumentReader" }
        maven { url "https://maven.regulaforensics.com/RegulaDocumentReader/Beta" }
        maven { url "https://maven.regulaforensics.com/RegulaDocumentReader/Nightly" }
        maven { url "https://maven.regulaforensics.com/RegulaDocumentReader/Stage" }
    }
}

dependencies {
    //noinspection GradleDynamicVersion
    implementation 'com.facebook.react:react-native:+'
    //noinspection GradleDependency
    implementation('com.regula.documentreader:api:9.8.13476') {
        transitive = true
    }
}
  
